<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Совет директоров Stels</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;600&display=swap">
<style>
/* Layout: horizontal mind map (root → agenda items → role/tasks/steps/questions → leaves); on narrow screens the same tree becomes an indented outline. */
:root {
  --bg: #F1F4F6; --surface: #FFFFFF; --ink: #15212A; --muted: #566772; --line: #CBD5DB; --onc: #FFFFFF;
  --c1: #2563C9; --c2: #0B7A6F; --c3: #357A1A; --c4: #8A6200; --c5: #BF4A10;
  --c6: #C93A3A; --c7: #A93389; --c8: #6A47D1; --c9: #4F6B80;
  --f-display: "Unbounded", "Golos Text", system-ui, sans-serif;
  --f-body: "Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11171C; --surface: #19222A; --ink: #E8EDF0; --muted: #95A5B0; --line: #33434E; --onc: #0E1317;
    --c1: #74A4F4; --c2: #43C4B3; --c3: #82CC60; --c4: #E3B53A; --c5: #F28F56;
    --c6: #F47878; --c7: #DB72BC; --c8: #AA92F6; --c9: #92AABD;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11171C; --surface: #19222A; --ink: #E8EDF0; --muted: #95A5B0; --line: #33434E; --onc: #0E1317;
  --c1: #74A4F4; --c2: #43C4B3; --c3: #82CC60; --c4: #E3B53A; --c5: #F28F56;
  --c6: #F47878; --c7: #DB72BC; --c8: #AA92F6; --c9: #92AABD;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 56px;
}
.page { max-width: 1160px; margin: 0 auto; }
.kicker { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
h1 { font-family: var(--f-display); font-weight: 600; font-size: clamp(26px, 5vw, 38px); line-height: 1.15; margin: 0 0 12px; text-wrap: balance; }
.lede { max-width: 66ch; color: var(--muted); margin: 0 0 22px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
button { font: inherit; color: inherit; }
.btn { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; font-size: 13.5px; font-weight: 600; cursor: pointer; }
.btn:hover { border-color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 28px; }
.chip { display: inline-flex; align-items: center; gap: 8px; background: var(--surface); border: 1.5px solid var(--c); border-radius: 999px; padding: 4px 12px 4px 4px; font-size: 13px; font-weight: 500; cursor: pointer; }
.chip b { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--c); color: var(--onc); font-size: 11.5px; font-weight: 700; }
button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

.mapwrap { overflow-x: auto; padding-bottom: 8px; }
.map { --c: var(--muted); width: max-content; min-width: 100%; }
ul { list-style: none; margin: 0; padding: 0; }
.row { display: flex; align-items: center; }
.node { position: relative; flex: none; }
.kids { margin-left: 18px; padding-left: 18px; display: flex; flex-direction: column; }
.kid { position: relative; padding-block: var(--pad, 5px); }
.kid::before { content: ""; position: absolute; left: -18px; top: 50%; width: 18px; height: 2px; margin-top: -1px; background: var(--c); }
.kid::after { content: ""; position: absolute; left: -18px; top: 0; bottom: 0; width: 2px; background: var(--c); }
.kid:first-child::after { top: 50%; }
.kid:last-child::after { bottom: 50%; }
.kid:only-child::after { display: none; }
.has-kids > .node::after { content: ""; position: absolute; left: 100%; top: 50%; width: 18px; height: 2px; margin-top: -1px; background: var(--c); }
.is-closed > .row > .kids { display: none; }
.is-closed > .row > .node::after { display: none; }

.rootnode { width: 200px; padding: 18px; border-radius: 20px; background: var(--ink); color: var(--bg); }
.rootnode strong { display: block; font-family: var(--f-display); font-weight: 600; font-size: 17px; line-height: 1.25; margin-bottom: 8px; }
.rootnode span { font-size: 12.5px; opacity: .8; }

.topic { padding-block: 14px; scroll-margin-top: 12px; }
.tnode { width: 270px; display: flex; align-items: flex-start; gap: 10px; text-align: left; background: var(--surface); border: 2px solid var(--c); border-radius: 14px; padding: 10px 12px; cursor: pointer; }
.num { flex: none; display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--c); color: var(--onc); font-family: var(--f-display); font-weight: 600; font-size: 12px; }
.ttext { flex: 1; min-width: 0; }
.ttext strong { display: block; font-size: 15px; line-height: 1.25; font-weight: 600; }
.ttext small { display: block; margin-top: 3px; font-size: 12.5px; line-height: 1.35; color: var(--muted); }
.chev { flex: none; width: 8px; height: 8px; margin: 9px 2px 0 0; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(-45deg); transition: transform .15s; }
.is-closed > .row > .tnode .chev, .is-closed > .row > .gnode .chev { transform: rotate(45deg); }
.topic:not(.is-closed) > .row > .tnode .chev { transform: rotate(-45deg); }

.gnode { width: 142px; display: flex; align-items: center; justify-content: space-between; gap: 6px; background: var(--c); color: var(--onc); border: 0; border-radius: 999px; padding: 6px 12px; font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; cursor: pointer; }
.gnode .chev { border-color: var(--onc); margin: 0 2px 0 0; width: 7px; height: 7px; }
.gnode i { font-style: normal; opacity: .85; font-weight: 600; margin-left: auto; margin-right: 4px; }
.group { --pad: 8px; }

.lnode { width: 380px; padding: 8px 12px; border-radius: 10px; font-size: 14px; line-height: 1.45; background: color-mix(in srgb, var(--c) 9%, var(--surface)); border: 1px solid color-mix(in srgb, var(--c) 30%, transparent); }


@media (max-width: 1099px) {
  .mapwrap { overflow-x: visible; }
  .map { width: auto; }
  .row { flex-direction: column; align-items: stretch; }
  .node { flex: none; }
  .kids { margin: 6px 0 0 12px; padding-left: 16px; border-left: 2px solid var(--c); }
  .kid::before { left: -16px; width: 16px; top: 22px; margin-top: 0; }
  .kid::after { display: none; }
  .has-kids > .node::after { display: none; }
  .rootnode { width: auto; max-width: 440px; }
  .tnode { width: 100%; max-width: 440px; }
  .gnode { width: 150px; }
  .lnode { width: auto; max-width: 480px; }
  .topic { padding-block: 8px; }
}
@media (prefers-reduced-motion: reduce) { .chev { transition: none; } }
</style>
</head>
<body>
<div class="page">
  <p class="kicker">Стратегическое планирование рекламы · самостоятельная работа</p>
  <h1>Совет директоров Stels</h1>
  <p class="lede">Ментальная карта начальника отдела рекламы и PR. В каждом из девяти пунктов повестки: моя роль, задачи, шаги и до трёх вопросов участникам совещания. Нажмите на ветку, чтобы свернуть её.</p>
  <div class="controls">
    <button class="btn" id="expandAll" type="button">Развернуть всё</button>
    <button class="btn" id="collapseAll" type="button">Свернуть до пунктов повестки</button>
  </div>
  <div class="chips" id="chips"></div>
  <div class="mapwrap"><div class="map" id="map"></div></div>

</div>

function el(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function chev() { return el("span", "chev"); }

function leafList(items) {
  var ul = el("ul", "kids");
  items.forEach(function (t) {
    var li = el("li", "kid leaf");
    li.appendChild(el("div", "lnode", t));
    ul.appendChild(li);
  });
  return ul;
}

function groupItem(label, items) {
  var li = el("li", "kid group has-kids");
  var row = el("div", "row has-kids");
  var b = el("button", "node gnode");
  b.type = "button";
  b.setAttribute("aria-expanded", "true");
  b.appendChild(el("span", null, label));
  b.appendChild(el("i", null, String(items.length)));
  b.appendChild(chev());
  b.addEventListener("click", function () {
    var closed = li.classList.toggle("is-closed");
    b.setAttribute("aria-expanded", closed ? "false" : "true");
  });
  row.appendChild(b);
  row.appendChild(leafList(items));
  li.appendChild(row);
  return li;
}

function topicItem(t) {
  var li = el("li", "kid topic");
  li.id = "t" + t.n;
  li.style.setProperty("--c", "var(--c" + t.n + ")");
  var row = el("div", "row has-kids");
  var b = el("button", "node tnode");
  b.type = "button";
  b.setAttribute("aria-expanded", "true");
  b.appendChild(el("span", "num", String(t.n)));
  var tx = el("span", "ttext");
  tx.appendChild(el("strong", null, t.title));
  tx.appendChild(el("small", null, t.sub));
  b.appendChild(tx);
  b.appendChild(chev());
  b.addEventListener("click", function () {
    var closed = li.classList.toggle("is-closed");
    b.setAttribute("aria-expanded", closed ? "false" : "true");
  });
  row.appendChild(b);
  var kids = el("ul", "kids");
  kids.appendChild(groupItem("Моя роль", t.role));
  kids.appendChild(groupItem("Задачи", t.tasks));
  kids.appendChild(groupItem("Шаги", t.steps));
  kids.appendChild(groupItem("Вопросы", t.q));
  row.appendChild(kids);
  li.appendChild(row);
  return li;
}

(function build() {
  var map = document.getElementById("map");
  var row = el("div", "row has-kids");
  var root = el("div", "node rootnode");
  root.appendChild(el("strong", null, "Отдел рекламы и PR"));
  root.appendChild(el("span", null, "Начальник отдела. Совещание совета директоров Stels, 9 пунктов повестки"));
  row.appendChild(root);
  var kids = el("ul", "kids");
  DATA.forEach(function (t) { kids.appendChild(topicItem(t)); });
  row.appendChild(kids);
  map.appendChild(row);

  var chips = document.getElementById("chips");
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  DATA.forEach(function (t) {
    var c = el("button", "chip");
    c.type = "button";
    c.style.setProperty("--c", "var(--c" + t.n + ")");
    c.appendChild(el("b", null, String(t.n)));
    c.appendChild(el("span", null, t.short));
    c.addEventListener("click", function () {
      var node = document.getElementById("t" + t.n);
      node.classList.remove("is-closed");
      node.querySelector(".tnode").setAttribute("aria-expanded", "true");
      node.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "start" });
    });
    chips.appendChild(c);
  });

  function setAll(topicsClosed) {
    document.querySelectorAll(".topic").forEach(function (n) {
      n.classList.toggle("is-closed", topicsClosed);
      n.querySelector(".tnode").setAttribute("aria-expanded", topicsClosed ? "false" : "true");
    });
    if (!topicsClosed) {
      document.querySelectorAll(".group").forEach(function (g) {
        g.classList.remove("is-closed");
        g.querySelector(".gnode").setAttribute("aria-expanded", "true");
      });
    }
  }
  document.getElementById("expandAll").addEventListener("click", function () { setAll(false); });
  document.getElementById("collapseAll").addEventListener("click", function () { setAll(true); });
})();
</script>
